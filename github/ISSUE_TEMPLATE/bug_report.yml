name: 🐛 Bug report
description: Something in 10tweaker is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it can be fixed.

        ⚠️ If a tweak broke something on your system, restore it with **System Restore** first, then tell us what happened.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
        - label: I am using the latest release of 10tweaker.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and short description of the bug.
      placeholder: After I applied a tweak, the program closed...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger the bug ourselves?
      placeholder: |
        1. Open 10tweaker
        2. Select a tweak
        3. Press Apply
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Tweaks
        - WinPEToRE
        - XClean (tray tool)
        - Installer
        - Interface
        - Other
    validations:
      required: true

  - type: input
    id: tweak
    attributes:
      label: Which tweak or tool?
      description: If the bug is tied to a specific tweak or tool, write its name here.
      placeholder: e.g. a tweak name, WinPEToRE
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 10tweaker version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 10 22H2, Windows 11 23H2
    validations:
      required: true

  - type: dropdown
    id: restore_point
    attributes:
      label: Did you create a restore point before applying tweaks?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any error text here. It will be formatted as code automatically.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images or screen recordings here.
